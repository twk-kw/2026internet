<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D-Day Calculator | Taewoo Kim</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-layout">
        <section class="page-title">
            <h1>Taewoo Kim</h1>
            <p>Software student interested in AI and engineering.</p>
        </section>

        <section class="info-card">
            <h2>D-Day Calculator</h2>
            <p>
                버튼을 눌러 목표 날짜를 조정하면 JavaScript의 Date 객체를 활용해 D-Day를 계산합니다.
            </p>

            <div class="dial-wrapper">
                <div class="date-dial">
                    <button type="button" class="dial-btn" data-type="year" data-action="plus">+</button>
                    <strong id="year-value">2026</strong>
                    <span>Year</span>
                    <button type="button" class="dial-btn" data-type="year" data-action="minus">−</button>
                </div>

                <div class="date-dial">
                    <button type="button" class="dial-btn" data-type="month" data-action="plus">+</button>
                    <strong id="month-value">9</strong>
                    <span>Month</span>
                    <button type="button" class="dial-btn" data-type="month" data-action="minus">−</button>
                </div>

                <div class="date-dial">
                    <button type="button" class="dial-btn" data-type="day" data-action="plus">+</button>
                    <strong id="day-value">12</strong>
                    <span>Day</span>
                    <button type="button" class="dial-btn" data-type="day" data-action="minus">−</button>
                </div>
            </div>

            <button type="button" id="calculate-btn" class="calculate-btn">
                Calculate D-Day
            </button>

            <div id="dday-result" class="dday-result">
                <div class="result-box muted">
                    <p>연도, 월, 일을 조정한 뒤 계산 버튼을 눌러주세요.</p>
                </div>
            </div>
        </section>
    </main>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html" class="active">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <footer>
        <small>&copy; <span id="year"></span> Taewoo Kim</small>
    </footer>

    <script>
        let selectedYear = 2026;
        let selectedMonth = 9;
        let selectedDay = 12;

        const yearValue = document.getElementById("year-value");
        const monthValue = document.getElementById("month-value");
        const dayValue = document.getElementById("day-value");
        const result = document.getElementById("dday-result");

        function getLastDay(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function updateDisplay() {
            const lastDay = getLastDay(selectedYear, selectedMonth);

            if (selectedDay > lastDay) {
                selectedDay = lastDay;
            }

            yearValue.textContent = selectedYear;
            monthValue.textContent = selectedMonth;
            dayValue.textContent = selectedDay;
        }

        document.querySelectorAll(".dial-btn").forEach(function (button) {
            button.addEventListener("click", function () {
                const type = button.dataset.type;
                const action = button.dataset.action;
                const change = action === "plus" ? 1 : -1;

                if (type === "year") {
                    selectedYear += change;
                    if (selectedYear < 1900) selectedYear = 1900;
                }

                if (type === "month") {
                    selectedMonth += change;

                    if (selectedMonth > 12) {
                        selectedMonth = 1;
                        selectedYear++;
                    }

                    if (selectedMonth < 1) {
                        selectedMonth = 12;
                        selectedYear--;
                    }
                }

                if (type === "day") {
                    selectedDay += change;
                    const lastDay = getLastDay(selectedYear, selectedMonth);

                    if (selectedDay > lastDay) selectedDay = 1;
                    if (selectedDay < 1) selectedDay = lastDay;
                }

                updateDisplay();
            });
        });

        document.getElementById("calculate-btn").addEventListener("click", function () {
            const now = new Date();
            const targetDate = new Date(selectedYear, selectedMonth - 1, selectedDay);

            const diffMs = targetDate.getTime() - now.getTime();
            const diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            let message = "";

            if (diffDay === 0) {
                message = "D-Day 입니다!";
            } else if (diffDay > 0) {
                message = `D-${diffDay}일 남았습니다.`;
            } else {
                message = `D+${Math.abs(diffDay)}일 지났습니다.`;
            }

            result.innerHTML = `
        <div class="result-box">
          <span class="result-label">Result</span>
          <h3>${message}</h3>

          <div class="date-info">
            <p><span>Target</span>${targetDate.toLocaleDateString()}</p>
            <p><span>Today</span>${now.toLocaleDateString()}</p>
          </div>
        </div>
      `;
        });

        updateDisplay();
    </script>

    <script src="script.js"></script>
</body>

</html>
